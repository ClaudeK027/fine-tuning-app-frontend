server {
    listen 80;
    server_name localhost;

    # Root directory for your React app's static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Rule for API calls
    # Any request to /api/... will be forwarded to the backend API server
    location /api/ {
        # IMPORTANT: Replace with your actual backend API address
        # 'host.docker.internal' is a special DNS name that resolves to the host machine from within a Docker container.
        proxy_pass http://host.docker.internal:8000/api/;

        # Standard proxy headers to pass along client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rule for all other requests (your React app)
    # This ensures that React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
